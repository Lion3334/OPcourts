name: Publish moved notice

# The old GitHub Pages site (lion3334.github.io/OPcourts) only shows a "moved" message linking to Vercel.
# This republishes that one page when it changes.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/moved-notice.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - id: deployment
        uses: actions/deploy-pages@v4

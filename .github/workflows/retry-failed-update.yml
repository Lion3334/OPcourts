name: Retry failed update

# If "Update court data and deploy" fails or is cancelled (for example GitHub never
# assigns a machine to the publish job), re-run just the failed jobs, up to 2 more times.
# Without this, fresh data sits unpublished until the next scheduled run.
on:
  workflow_run:
    workflows: ["Update court data and deploy"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
      && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}

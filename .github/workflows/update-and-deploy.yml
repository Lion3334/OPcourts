name: Update court data

# Fetches fresh court availability and commits it. The site itself is hosted on Vercel,
# which redeploys by itself on every push to main, so this workflow doesn't build or deploy.
on:
  schedule:
    # 4am and 6pm Pacific during daylight time (11:00 and 01:00 UTC).
    # GitHub schedules run on UTC and ignore daylight saving, so in winter
    # these land at 3am and 5pm Pacific.
    - cron: '0 11 * * *'
    - cron: '0 1 * * *'
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - '.github/workflows/update-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch court availability
        run: node scraper/index.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/courts.json
          # No [skip ci] here: Vercel skips commits that contain it, and it needs this push to redeploy with the new data.
          # Pushes made with the workflow's own token don't start another workflow run, so this can't loop.
          git diff --staged --quiet || (git commit -m "Update court availability data" && git push)
